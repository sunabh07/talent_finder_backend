[project]
name = "talentfinder-backend"
version = "0.1.0"
description = "Talent Finder Recruiter Portal - multi-tenant recruitment API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.3",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "error::DeprecationWarning:app.*",
    # Upstream notice from starlette's TestClient; nothing actionable here.
    "ignore:Using `httpx` with `starlette.testclient`:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: FastAPI expresses Depends()/Query() as argument defaults by design.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Alembic generates these; they are reviewed, not hand-formatted.
"alembic/versions/*" = ["E501"]
# env.py must configure sys.path before importing the application package.
"alembic/env.py" = ["E402"]
